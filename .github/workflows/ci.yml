name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Testes · Duplicatas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npx jest --ci --coverage=false

      - name: Detectar código duplicado (jscpd)
        run: npx jscpd src --min-lines 12 --min-tokens 60 --threshold 8 --reporters console

      - name: TypeScript (informativo)
        run: npm run typecheck
        continue-on-error: true

  android-build:
    name: Build Android (assembleRelease)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Não instalar o pacote legado "tools" (foi removido do sdkmanager).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Assemble Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
