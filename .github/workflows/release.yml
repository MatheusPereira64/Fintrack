name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build APK e publicar Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Não instalar o pacote legado "tools" (foi removido do sdkmanager).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Ler versão do tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p dist
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "dist/FinTrack-${{ steps.ver.outputs.version }}.apk"
          ls -lh dist/

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FinTrack ${{ steps.ver.outputs.version }}
          body: |
            ## FinTrack ${{ steps.ver.outputs.version }}

            Baixe o APK abaixo e instale no Android.

            O app também verifica esta release automaticamente ao abrir
            (Configurações → Procurar atualizações).

            ```
            versionCode: 4
            ```

            **Dados do usuário:** a atualização pelo mesmo pacote `com.fintrackapp`
            e mesma assinatura **não apaga** o banco SQLite local.
          files: |
            dist/FinTrack-${{ steps.ver.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
