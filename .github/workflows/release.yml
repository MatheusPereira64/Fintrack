name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex: v1.0.6)'
        required: true
        default: 'v1.0.6'

permissions:
  contents: write

jobs:
  version:
    name: Versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android:
    name: Build APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Preparar keystore de produção
        env:
          FINTRACK_UPLOAD_KEYSTORE_BASE64: ${{ secrets.FINTRACK_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FINTRACK_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret FINTRACK_UPLOAD_KEYSTORE_BASE64 não configurado (ver docs/RELEASES.md)."
            exit 1
          fi
          echo "$FINTRACK_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fintrack-upload.jks"
          echo "FINTRACK_UPLOAD_STORE_FILE=$RUNNER_TEMP/fintrack-upload.jks" >> "$GITHUB_ENV"

      - name: Assemble Release APK
        working-directory: android
        env:
          FINTRACK_UPLOAD_STORE_PASSWORD: ${{ secrets.FINTRACK_UPLOAD_STORE_PASSWORD }}
          FINTRACK_UPLOAD_KEY_ALIAS: ${{ secrets.FINTRACK_UPLOAD_KEY_ALIAS }}
          FINTRACK_UPLOAD_KEY_PASSWORD: ${{ secrets.FINTRACK_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PFINTRACK_REQUIRE_RELEASE_SIGNING=true

      - name: Conferir assinatura do APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.FINTRACK_UPLOAD_CERT_SHA256 }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee signing.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' signing.txt | awk '{print $NF}')
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK assinado com outro certificado ($ACTUAL). Os usuários não conseguiriam atualizar."
              exit 1
            fi
          else
            echo "::warning::Defina a variável FINTRACK_UPLOAD_CERT_SHA256=$ACTUAL para travar o certificado."
          fi
          rm -f "$FINTRACK_UPLOAD_STORE_FILE" signing.txt

      - name: Preparar APK
        run: |
          mkdir -p dist
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "dist/FinTrack-${{ needs.version.outputs.version }}.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/FinTrack-${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  ios:
    name: Build IPA
    needs: version
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install dependencies
        run: npm ci

      - name: CocoaPods
        working-directory: ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          pod --version
          pod install

      - name: Archive iOS (IPA)
        env:
          RCT_NO_LAUNCH_PACKAGER: 1
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p ios/build dist
          xcodebuild \
            -workspace ios/FinTrackApp.xcworkspace \
            -scheme FinTrackApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/FinTrack.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION=10 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive

          chmod +x scripts/package-ios-ipa.sh
          scripts/package-ios-ipa.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/FinTrack-${{ needs.version.outputs.version }}.ipa
          if-no-files-found: error

  publish:
    name: Publicar Release
    needs: [version, android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Listar artefatos
        run: ls -lh dist/

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: FinTrack ${{ needs.version.outputs.version }}
          body: |
            ## FinTrack ${{ needs.version.outputs.version }}

            ### Android
            Baixe **FinTrack-${{ needs.version.outputs.version }}.apk** e instale no aparelho.

            O app também verifica esta release automaticamente ao abrir
            (Configurações → Procurar atualizações).

            ### iOS
            Baixe **FinTrack-${{ needs.version.outputs.version }}.ipa** (pacote padrão do iOS).

            A Apple não permite instalar um `.ipa` baixado da internet como no Android.
            Use TestFlight, uma conta de desenvolvedor ou um sideload (AltStore / Sideloadly)
            com certificado válido. Este IPA é o arquivo de distribuição; a instalação
            em iPhone exige assinatura Apple.

            ```
            versionCode: 10
            ```

            **Dados do usuário (Android):** a atualização pelo mesmo pacote `com.fintrackapp`
            e mesma assinatura **não apaga** o banco SQLite local.
          files: |
            dist/FinTrack-${{ needs.version.outputs.version }}.apk
            dist/FinTrack-${{ needs.version.outputs.version }}.ipa
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
